name: Review build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scan:source
      - run: npm run package:release
      - name: Attest release assets
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/release/0.1.2/*
      - name: Keep the exact verified release files
        uses: actions/upload-artifact@v4
        with:
          name: agentlens-social-importer-0.1.2
          path: dist/release/0.1.2/*
          if-no-files-found: error
